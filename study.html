<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070707">
  <title>Batch Explorer — CODEX STUDYS</title>
  <link rel="icon" href="assets/sf-icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/sf-icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="study.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="CODEX STUDYS home">
      <img src="assets/icon-192.png" alt="" width="28" height="28">
      <span>CODEX STUDYS</span>
    </a>
    <a class="home-link" href="index.html">All batches</a>
  </header>

  <main class="wrap">
    <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    <h1 class="page-title" id="pageTitle">Loading…</h1>

    <div class="state" id="loading" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p>Loading content…</p>
    </div>

    <div class="state hidden" id="errorBox" role="alert">
      <p id="errorText">Something went wrong.</p>
      <button class="btn btn-primary" type="button" id="retryBtn">Retry</button>
    </div>

    <div class="state hidden" id="emptyBox">
      <p>This folder is empty.</p>
    </div>

    <section class="grid hidden" id="grid" aria-live="polite"></section>
    <div class="more hidden" id="moreLoading"><div class="spinner spinner-sm" aria-hidden="true"></div><span>Loading more…</span></div>
  </main>

  <!-- Video player -->
  <div class="modal hidden" id="playerModal" role="dialog" aria-modal="true" aria-labelledby="playerTitle">
    <div class="modal-card modal-wide">
      <div class="modal-head">
        <h2 id="playerTitle">Lecture</h2>
        <button class="icon-btn" type="button" id="playerClose" aria-label="Close player">✕</button>
      </div>
      <div class="player-box" id="playerBox">
        <video id="video" controls playsinline preload="metadata"></video>
        <iframe id="playerFrame" class="hidden" title="Embedded player" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
        <div class="player-overlay hidden" id="playerLoading"><div class="spinner"></div></div>
        <div class="player-overlay hidden" id="playerError">
          <p id="playerErrorText">Could not load this lecture.</p>
          <button class="btn btn-primary" type="button" id="playerRetry">Retry</button>
        </div>
      </div>
      <div class="player-controls">
        <label class="select-wrap" id="qualityWrap">
          <span>Quality</span>
          <select id="qualitySelect" aria-label="Video quality"></select>
        </label>
        <button class="btn" type="button" id="embedToggle">Use embedded player</button>
        <a class="btn" id="externalBtn" href="#" target="_blank" rel="noopener noreferrer">Open in new tab</a>
        <a class="btn" id="playerPdfBtn" href="#" target="_blank" rel="noopener noreferrer">PDF</a>
      </div>
    </div>
  </div>

  <!-- PDF viewer -->
  <div class="modal hidden" id="pdfModal" role="dialog" aria-modal="true" aria-labelledby="pdfTitle">
    <div class="modal-card modal-wide">
      <div class="modal-head">
        <h2 id="pdfTitle">Document</h2>
        <button class="icon-btn" type="button" id="pdfClose" aria-label="Close viewer">✕</button>
      </div>
      <div class="pdf-box">
        <iframe id="pdfFrame" title="PDF viewer"></iframe>
      </div>
      <div class="player-controls">
        <a class="btn btn-primary" id="pdfOpen" href="#" target="_blank" rel="noopener noreferrer">Open in new tab</a>
        <a class="btn" id="pdfDownload" href="#" download target="_blank" rel="noopener noreferrer">Download</a>
      </div>
      <p class="hint">If the preview stays blank on your phone, use “Open in new tab” or “Download”.</p>
    </div>
  </div>

  <script src="sf-api.js"></script>
  <script src="study.js"></script>
</body>
</html>
